# JSON access log for mcp.novada.com. Never logs the query string ($uri, not
# $request_uri) — clients may send ?apikey= — and masks a key-shaped first path
# segment (/<key>/mcp). Adds timing Vercel never exposed: request_time (total)
# and upstream_response_time (time inside Node).
map $uri $novada_safe_uri {
    "~^/[A-Za-z0-9_-]{20,}/mcp$"  "/<redacted>/mcp";
    default                       $uri;
}
log_format novada_json escape=json
  '{"ts":"$time_iso8601","ip":"$remote_addr","host":"$host","method":"$request_method",'
  '"path":"$novada_safe_uri","status":$status,"bytes":$body_bytes_sent,'
  '"rt":$request_time,"urt":"$upstream_response_time","proto":"$server_protocol",'
  '"ua":"$http_user_agent","rid":"$request_id"}';
