# /etc/nginx/snippets/novada-mcp-proxy.conf — shared proxy settings for the
# novada-mcp 443 server blocks (one per hostname — see nginx-novada-mcp.conf).
# Mirrors the live file exactly (confirmed via `nginx -T` capture, 2026-10-29
# — see .claude/ec2-migration/live-nginx-T-2026-10-29.txt), plus the
# zero-downtime `proxy_next_upstream` additions from this incident fix, which
# MIGRATE-TO-TEMPLATE-UNIT.md applies to the LIVE copy of this same file
# in place (never by copying this whole file over the live one — see that
# doc and nginx-novada-mcp.conf's header for why).
access_log /var/log/nginx/novada-mcp.access.json novada_json;
# Same HSTS policy Vercel serves today (max-age 2y).
add_header Strict-Transport-Security "max-age=63072000" always;

client_max_body_size 10m;

location / {
    proxy_pass http://novada_mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The app's per-IP rate limit trusts x-vercel-forwarded-for, then x-real-ip
    # (api/mcp.ts getClientIp). Overwrite BOTH with the real peer address so a
    # client can't forge them to dodge the limit.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Vercel-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Tool calls may run up to 300s (FUNCTION_MAX_DURATION_S).
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    # Streamable HTTP may answer with SSE; don't buffer it.
    proxy_buffering off;

    # Zero-downtime restarts (incident fix 2026-10-29): while one
    # `novada-mcp@<port>` instance is being restarted, requests that hit it
    # are retried against the OTHER instance instead of surfacing as a 502.
    #   - `error timeout` (the nginx DEFAULT, listed explicitly here so it's
    #     not silently lost if this line is ever edited) covers "connection
    #     refused" (instance mid-restart, not listening yet) and a read
    #     timeout.
    #   - `http_502` additionally covers the case where the instance
    #     accepted the TCP connection but the app itself hadn't started
    #     serving yet (rare, but cheap to also cover).
    #   - Confirmed from nginx's own docs (proxy_next_upstream,
    #     https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_next_upstream):
    #     "normally, requests with a non-idempotent method (POST, LOCK,
    #     PATCH) are not passed to the next server if a request has been
    #     sent to an upstream server" — i.e. a POST (every real MCP tool
    #     call) is retried on the other instance ONLY if nothing was sent to
    #     the first one yet (pure connection failure); once nginx has
    #     started forwarding the request body to an instance, a mid-stream
    #     failure on THAT instance is surfaced as a failure to the client,
    #     never silently re-sent to the other instance as a duplicate call.
    #     `non_idempotent` is deliberately NOT added here — doing so would
    #     let nginx retry a POST that already reached the app, risking a
    #     duplicate tool execution.
    #   - Residual, accepted race (see server.mts's drainServer() for the
    #     sibling in-process case): if nginx hands a request to an instance
    #     in the single tick it is going down, the worst case is ONE
    #     client-visible 502 for that one request (covered by the
    #     next_upstream retry above whenever nothing was sent yet) — never a
    #     silently duplicated tool call, for the same non_idempotent reason.
    proxy_next_upstream error timeout http_502;
    # Two servers in the upstream block -> at most 2 useful attempts (the
    # default, 0, would try every server in the block regardless of count,
    # which has the same effect here but is left explicit).
    proxy_next_upstream_tries 2;
}
