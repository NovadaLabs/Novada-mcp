# /etc/nginx/sites-available/novada-mcp — reverse proxy to the Node server on 127.0.0.1:3000.
# TLS is added by certbot once DNS points here (it edits this file in place):
#   certbot --nginx -d <host> --redirect, then add `http2` to the `listen 443 ssl` lines it writes.

upstream novada_mcp {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Unknown Host headers / SNI (scanners hitting the bare IP) get dropped — on both
# ports, so the mcp block never becomes the implicit default once certbot adds 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.novada.com mcp-staging.novada.com;
    # Same HSTS policy Vercel serves today (max-age 2y); browsers ignore it over plain http.
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://novada_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app's per-IP rate limit trusts x-vercel-forwarded-for, then x-real-ip
        # (api/mcp.ts getClientIp). Overwrite BOTH with the real peer address so a
        # client can't forge them to dodge the limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Vercel-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Tool calls may run up to 300s (FUNCTION_MAX_DURATION_S).
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        # Streamable HTTP may answer with SSE; don't buffer it.
        proxy_buffering off;
    }
}
