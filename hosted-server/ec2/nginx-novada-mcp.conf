# /etc/nginx/sites-available/novada-mcp — reverse proxy to TWO Node instances
# (zero-downtime restarts, incident fix 2026-10-29). One 443 block per
# hostname so each presents its own certificate; shared proxy settings live
# in /etc/nginx/snippets/novada-mcp-proxy.conf — see
# ./nginx-snippet-novada-mcp-proxy.conf in this same directory for that
# file's template.
#
# This mirrors the LIVE structure exactly (confirmed against a real
# `nginx -T` capture on 2026-10-29 — see
# .claude/ec2-migration/live-nginx-T-2026-10-29.txt), including the fact
# that the live box has already split into per-domain 443 blocks + the
# shared snippet — this file is NOT a pre-split, single-combined-block
# config anymore.
#
# ── DO NOT `cp` this file onto the live box ─────────────────────────────────
# This template exists so a FRESH provision (a brand-new box, before any
# cert exists) reproduces today's live structure. The live box has already
# diverged from a from-scratch provision in ways this file cannot represent
# (real cert paths, certbot-managed includes — see the placeholders below
# and MIGRATE-TO-TEMPLATE-UNIT.md's "remaining intentional differences"
# list). Applying this file wholesale to the live box would DELETE its real
# TLS config for both hostnames — see MIGRATE-TO-TEMPLATE-UNIT.md, which
# patches the two still-mutable pieces (the `upstream` block and the shared
# snippet) IN PLACE on the live files instead.
#
# TLS bootstrap on a FRESH box: run `certbot --nginx -d mcp.novada.com
# -d mcp-staging.novada.com --redirect` once this file (with its
# `ssl_certificate`/`ssl_certificate_key` lines temporarily removed — certbot
# adds them itself) and the ACME webroot location are in place; certbot
# rewrites the two per-hostname 443 blocks in place to add the real cert
# paths, `include /etc/letsencrypt/options-ssl-nginx.conf;`, and
# `ssl_dhparam`. The versions of those three directives below are
# PLACEHOLDERS for exactly that reason (see the inline comments).

upstream novada_mcp {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;
    keepalive 32;
}

# Unknown Host headers / SNI (scanners hitting the bare IP) get dropped — on
# both ports, so the per-hostname blocks below never become the implicit
# default.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.novada.com;
    # PLACEHOLDER — certbot-managed on a fresh box; do not hand-author these
    # paths. Live values confirmed via `nginx -T`:
    #   ssl_certificate      /etc/letsencrypt/live/mcp.novada.com/fullchain.pem;
    #   ssl_certificate_key  /etc/letsencrypt/live/mcp.novada.com/privkey.pem;
    ssl_certificate /etc/letsencrypt/live/mcp.novada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.novada.com/privkey.pem;
    # PLACEHOLDER — certbot-managed files; only exist after the FIRST
    # successful `certbot --nginx` run on this box (see the bootstrap note
    # above). Not reproducible by provision-base.sh alone.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/novada-mcp-proxy.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-staging.novada.com;
    # PLACEHOLDER — see mcp.novada.com's block above; same caveats apply.
    ssl_certificate /etc/letsencrypt/live/mcp-staging.novada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-staging.novada.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/novada-mcp-proxy.conf;
}

# HTTP: ACME HTTP-01 challenges are served from the webroot (for renewals
# after DNS points here); everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.novada.com mcp-staging.novada.com;
    # JSON log without query strings; format in nginx-novada-mcp-log.conf (→ /etc/nginx/conf.d/).
    access_log /var/log/nginx/novada-mcp.access.json novada_json;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
